spring:
  application:
    name: cloud-storage-service
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

server:
  port: 8080

aws:
  region: us-east-1
  s3:
    # Uses AWS_S3_ENDPOINT env variable if provided, defaults to http://localhost:4566
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    # External endpoint returned to clients for direct upload/download
    external-endpoint: ${AWS_S3_EXTERNAL_ENDPOINT:http://localhost:4566}
    bucket-name: my-test-bucket
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

logging:
  level:
    root: INFO
    # Enables DEBUG logs for your application package
    com.example.cloudstorage: DEBUG
    # Enables DEBUG logs for Spring Cloud AWS SQS framework
    io.awspring.cloud.sqs: DEBUG
    software.amazon.awssdk: WARN
